<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Code Auditor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Code Auditor</h1>
            <p>Загрузите ваши .py или .js файлы для мгновенного анализа качества кода</p>
        </header>

        <main>
            <section class="upload-section">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="file">Файлы</button>
                    <button class="tab-btn" data-tab="git">GitHub / GitLab</button>
                </div>

                <div id="fileTab" class="tab-content">
                    <form id="uploadForm">
                        <div class="file-input-wrapper">
                            <input type="file" id="fileInput" accept=".py,.js" multiple required>
                            <label for="fileInput">Выберите файлы проекта</label>
                        </div>
                        <button type="submit" id="submitBtn">Анализировать файлы</button>
                    </form>
                </div>

                <div id="gitTab" class="tab-content hidden">
                    <form id="gitForm">
                        <div class="file-input-wrapper">
                            <input type="url" id="gitUrl" placeholder="https://github.com/user/repo" required>
                        </div>
                        <button type="submit" id="gitSubmitBtn">Клонировать и проверить</button>
                    </form>
                </div>

                <div id="statusMessage" class="status-box hidden">
                    <span class="spinner"></span>
                    <span class="text">Обработка кода...</span>
                </div>
            </section>

            <section id="resultsSection" class="results-section">
                <h2>Результаты</h2>
                <div id="statsSummary" class="stats-summary hidden"></div>
                <div class="table-container">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>Файл</th>
                                <th>Строка</th>
                                <th>Правило</th>
                                <th>Уровень</th>
                                <th>Сообщение</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <!-- Результаты будут добавлены через JS -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyMessage" class="empty-state">
                    Пока нет данных для отображения. Загрузите файл.
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Code Auditor Pro. Built for high-performance development teams.</p>
        </footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
