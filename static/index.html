<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Pro</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23007aff'/><path d='M30 50 L45 65 L70 35' stroke='white' stroke-width='8' fill='none'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="logo">Auditor<span>Pro</span></div>
            <nav class="supported-langs">
                <span class="lang-tag python">Python</span>
                <span class="lang-tag js">JavaScript</span>
                <span class="lang-tag cpp">C++</span>
                <span class="lang-tag go">Go</span>
                <span class="lang-tag html">Web</span>
                <span class="lang-tag java">Java</span>
            </nav>
        </header>

        <main>
            <section class="hero-section">
                <h1>Безупречный код.</h1>
                <p>Анализ безопасности и сложности в одно мгновение.</p>
            </section>

            <section class="action-card">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="git">GitHub / GitLab</button>
                    <button class="tab-btn" data-tab="file">Локальные файлы</button>
                </div>

                <div id="gitTab" class="tab-content">
                    <form id="gitForm" class="apple-form">
                        <div class="input-group">
                            <svg class="git-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                            <input type="url" id="gitUrl" placeholder="https://github.com/username/repository" required>
                            <button type="submit" id="gitSubmitBtn">Проверить</button>
                        </div>
                    </form>
                </div>

                <div id="fileTab" class="tab-content hidden">
                    <form id="uploadForm" class="file-upload-row">
                        <div class="drop-zone" id="dropZone">
                            <input type="file" id="fileInput" multiple hidden>
                            <div class="drop-zone-content">
                                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                                </svg>
                                <p>Перетащите файлы сюда или <span>выберите</span></p>
                            </div>
                        </div>
                        <button type="submit" id="submitBtn" class="side-submit-btn">Анализировать</button>
                    </form>
                </div>

                <div id="statusMessage" class="status-overlay hidden">
                    <div class="loader"></div>
                    <p>Анализируем...</p>
                </div>
            </section>

            <section id="resultsSection" class="results-section hidden">
                <div class="summary-grid">
                    <div class="health-card">
                        <div class="score-container">
                            <svg viewBox="0 0 100 100" class="score-ring">
                                <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
                                <circle class="ring-fill" cx="50" cy="50" r="45" id="healthScoreFill"></circle>
                            </svg>
                            <div class="score-value">
                                <span id="healthScoreText">100</span><small>%</small>
                            </div>
                        </div>
                        <div class="health-label">Индекс здоровья</div>
                    </div>

                    <div class="mini-card critical">
                        <div class="card-inner">
                            <span class="val" id="statCritical">0</span>
                            <span class="lbl">Критических</span>
                        </div>
                    </div>
                    <div class="mini-card warning">
                        <div class="card-inner">
                            <span class="val" id="statWarning">0</span>
                            <span class="lbl">Замечаний</span>
                        </div>
                    </div>
                    <div class="mini-card security">
                        <div class="card-inner">
                            <span class="val" id="statSecurity">0</span>
                            <span class="lbl">Уязвимостей</span>
                        </div>
                    </div>
                </div>

                    <div class="issues-main full-width">
                        <div class="filter-pills">
                            <button class="pill active" data-severity="all">Все</button>
                            <button class="pill" data-severity="critical">Критические</button>
                            <button class="pill" data-severity="warning">Стиль</button>
                            <button class="pill" data-severity="security">Безопасность</button>
                            <button class="pill" data-severity="complexity">Сложность</button>
                        </div>
                        <div id="issuesList" class="issues-stack"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Monaco Modal -->
    <div id="codeModal" class="modal hidden">
        <div class="modal-window">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <span id="modalTitle">Source Code</span>
                </div>
                <button id="closeModal" class="modal-close-btn">Закрыть</button>
            </div>
            <div id="monaco-container"></div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
